        var durigonBounds = [[-27.39005629984856,-51.43406147178727],[-27.37618438957535,-51.405830925545565]];

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

/* ====== Home / Recenter control (Casinha) ====== */

        var hintEl = document.getElementById('ecomapHint');

        function formatPtBR(n, decimals){
            try{
                return n.toLocaleString('pt-BR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
            }catch(e){
                var s = n.toFixed(decimals);
                return s.replace('.', ',');
            }
        }

        function formatArea(m2){
            if(m2 >= 10000){
                return formatPtBR(m2/10000, 4) + ' ha';
            }
            return formatPtBR(m2, 2) + ' m²';
        }

        // Cálculo de área geodésica (sem dependências externas)
        // Fórmula esférica (variação Chamberlain & Duquette), usada em diversas ferramentas Leaflet.
        function geodesicArea(latLngs){
            var points = latLngs;
            if(!points || points.length < 3) return 0;

            var radius = 6378137; // WGS84 (m)
            var area = 0;

            for (var i = 0, len = points.length; i < len; i++) {
                var p1 = points[i];
                var p2 = points[(i + 1) % len];

                var lon1 = p1.lng * Math.PI / 180;
                var lon2 = p2.lng * Math.PI / 180;
                var lat1 = p1.lat * Math.PI / 180;
                var lat2 = p2.lat * Math.PI / 180;

                area += (lon2 - lon1) * (2 + Math.sin(lat1) + Math.sin(lat2));
            }

            area = area * radius * radius / 2.0;
            return Math.abs(area);
        }

        function formatDistance(meters){
            if(meters >= 1000){
                return formatPtBR(meters/1000, 3) + ' km';
            }
            return formatPtBR(meters, 2) + ' m';

// Garante que a trena fique sempre ACIMA dos ortomosaicos (panes do qgis2web)
function ecomapBringMeasureToFront(){
    try{
        // pane da trena
        var p = map.getPane('pane_EcoMapMeasure');
        if(p) p.style.zIndex = 100000;

        // tooltips/popups acima também
        var tp = map.getPane('tooltipPane');
        if(tp) tp.style.zIndex = 110000;
        var pp = map.getPane('popupPane');
        if(pp) pp.style.zIndex = 110000;

        // paths já desenhados
        if(measureLayer && measureLayer.eachLayer){
            measureLayer.eachLayer(function(lyr){
                if(lyr && lyr.bringToFront) lyr.bringToFront();
            });
        }
    }catch(e){}
}

var measureLayer = L.layerGroup().addTo(map);

        function computeTotalDistance(points){
            var total = 0;
            for(var i=1;i<points.length;i++){

function fmtMeters(m){
  if (!isFinite(m)) return '-';
  return (m >= 1000) ? (m/1000).toFixed(2).replace('.',',') + ' km' : m.toFixed(2).replace('.',',') + ' m';
}
function fmtArea(a){
  if (!isFinite(a)) return '-';
  return (a/10000).toFixed(4).replace('.',',') + ' ha';
}
function lineLength(latlngs){
  var sum = 0;
  for (var i=1;i<latlngs.length;i++){ sum += map.distance(latlngs[i-1], latlngs[i]); }
  return sum;
}
function polygonPerimeter(latlngs){
  if (latlngs.length < 2) return 0;
  var sum = lineLength(latlngs);
  sum += map.distance(latlngs[latlngs.length-1], latlngs[0]);
  return sum;
}
function polygonArea(latlngs){
  try {
    if (L.GeometryUtil && typeof L.GeometryUtil.geodesicArea === 'function'){
      return Math.abs(L.GeometryUtil.geodesicArea(latlngs));
    }
  } catch(e) {}
  return NaN;
}

function toDMS(deg, isLat){
  // Converte graus decimais para DMS, sem casas decimais nos segundos
  var hemi = isLat ? (deg < 0 ? 'S' : 'N') : (deg < 0 ? 'W' : 'E');
  var abs = Math.abs(deg);
  var d = Math.floor(abs);
  var minFloat = (abs - d) * 60;
  var m = Math.floor(minFloat);
  var secFloat = (minFloat - m) * 60;
  var s = Math.round(secFloat);

  // normaliza arredondamentos (ex.: 59.9 -> 60)
  if(s === 60){ s = 0; m += 1; }
  if(m === 60){ m = 0; d += 1; }

  return d + '°' + String(m).padStart(2,'0') + "'" + String(s).padStart(2,'0') + '"' + hemi;
}


function refreshNotesTable(){
  var panel = document.getElementById('ecomapNotesTablePanel');
  var wrap = document.getElementById('ecomapNotesTableWrap');
  if (!panel || !wrap) return;

  
  var tableBtn = window._ecomapNotesTableBtn || null;
  if (tableBtn){ tableBtn.style.display = 'none'; }
// se as ferramentas de anotação estiverem recolhidas, a tabela deve ficar oculta
  if (!notesToolsOpen){
    panel.style.display = 'none';
    return;
  }

  var rows = [];
  notesLayer.eachLayer(function(l){
    var type = (l instanceof L.Marker) ? 'Ponto' : (l instanceof L.Polygon && !(l instanceof L.Rectangle) ? 'Polígono' : (l instanceof L.Polyline ? 'Linha' : 'Feição'));
    var name = (l.feature && l.feature.properties && (l.feature.properties.note || l.feature.properties.name)) ? (l.feature.properties.note || l.feature.properties.name) : '(sem nome)';
    var metric = '-';
    if (l instanceof L.Marker){
      var pt = l.getLatLng ? l.getLatLng() : null;
      if(pt){
        metric = 'Lat: ' + toDMS(pt.lat, true) + ' | Lon: ' + toDMS(pt.lng, false);
      }
    }
    if (l instanceof L.Polyline && !(l instanceof L.Polygon)){
      var ll = l.getLatLngs();
      metric = fmtMeters(lineLength(ll));
    } else if (l instanceof L.Polygon){
      var ring = l.getLatLngs();
      ring = Array.isArray(ring) && Array.isArray(ring[0]) ? ring[0] : ring;
      var a = polygonArea(ring);
      var p = polygonPerimeter(ring);
      metric = fmtArea(a) + ' | ' + fmtMeters(p);
    }
    rows.push({name:name, type:type, metric:metric});
  });

  if (rows.length === 0){
    panel.style.display = 'none';
    wrap.innerHTML = '';
    if (tableBtn){ tableBtn.style.display = 'none'; }
    return;
  }

  // há feições: habilita botão da tabela (no mobile)
  if (tableBtn){ tableBtn.style.display = ''; }

  // respeitar o estado recolhida/aberta (desktop + mobile)
  if (!notesTableVisible){
    panel.style.display = 'none';
    return;
  }

  var html = '<table><thead><tr><th>Nome</th><th>Tipo</th><th>Medições</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html += '<tr><td>'+String(r.name).replace(/</g,'&lt;')+'</td><td>'+r.type+'</td><td>'+r.metric+'</td></tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  panel.style.display = 'block';
}

(function(){
  // força Leaflet.draw a não finalizar por duplo-clique
  try{ if(drawPolyline && drawPolyline.options) drawPolyline.options.finishOnDoubleClick = false; }catch(e){}
  try{ if(drawPolygon && drawPolygon.options) drawPolygon.options.finishOnDoubleClick = false; }catch(e){}

  function gateFinish(handler){
    if(!handler || handler.__ecomapFinishGated) return;
    handler.__ecomapFinishGated = true;
    var origFinish = handler._finishShape;
    if(typeof origFinish !== 'function') return;

    handler._finishShape = function(){
      if(!this._ecomapAllowFinish){
        return; // bloqueia qualquer finalização por gesto/clique
      }
      return origFinish.apply(this, arguments);
    };
  }

  gateFinish(drawPolyline);
  gateFinish(drawPolygon);

  function bindButtons(){
    var btnFinish = document.getElementById('ecomapBtnFinish');
    var btnCancel = document.getElementById('ecomapBtnCancel');
    if(!btnFinish || !btnCancel) return;

    btnFinish.addEventListener('click', function(){
      var h = _ecomapGetActiveDrawHandler();
      if(!h) return;
      try{
        h._ecomapAllowFinish = true;
        if(typeof h._finishShape === 'function') h._finishShape();
      }catch(e){}
      try{ h._ecomapAllowFinish = false; }catch(e){}
    });

    btnCancel.addEventListener('click', function(){
      var h = _ecomapGetActiveDrawHandler();
      try{ if(h) h.disable(); }catch(e){}
      try{ stopAllNoteModes && stopAllNoteModes(); }catch(e){}
      showFinishBar(false);
    });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindButtons);
  else bindButtons();
})();

        var layer = e.layer;

        // metadados
        ensureFeatureMeta(layer);

        // pergunta observação
        var txt = prompt('Observação:', '');
        if(txt !== null){
            layer.feature.properties.note = String(txt || '').trim();
        }else{
            layer.feature.properties.note = '';
        }
        layer.feature.properties.updated_at = nowISO();

        // estilo extra para marker
        if(e.layerType === 'marker'){
            // nada especial; o default marker ok
        }else{
            try{ layer.setStyle && layer.setStyle(notesShapeOptions); }catch(err){}
        }

        setNotesLayerInteractive(layer, true);

        notesLayer.addLayer(layer);
    refreshNotesTable();
        bindNoteInteractions(layer);
    }catch(err){}
});

map.on('draw:edited', function (e) {
    try{
        e.layers.eachLayer(function(layer){
            ensureFeatureMeta(layer);
            layer.feature.properties.updated_at = nowISO();
            bindNoteInteractions(layer);
        });
    }catch(err){}
});

// ===== Exportação GeoJSON =====
function downloadTextFile(filename, textContent){
    var blob = new Blob([textContent], {type: 'application/geo+json;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 800);
}

function exportNotesGeoJSON(){
    try{
        if(!notesLayer || notesLayer.getLayers().length === 0){
            alert('Não há anotações para exportar.');
            return;
        }
        var gj = notesLayer.toGeoJSON();
        // garantia: incluir CRS não é padrão no GeoJSON moderno, então omitimos.
        var txt = JSON.stringify(gj, null, 2);
        var fname = 'anotacoes_santa_lucia_' + (new Date().toISOString().slice(0,10)) + '.geojson';
        downloadTextFile(fname, txt);
    }catch(e){
        alert('Falha ao exportar anotações.');
    }
}

function clearAllNotes(){
    if(!notesLayer) return;
    var ok = confirm('Apagar TODAS as anotações desta sessão?');
    if(!ok) return;
    notesLayer.clearLayers();
    hideHint();
}

var notesBtns = [];

var notesGroup = null;

var notesToolsOpen = false; // controla exibição da tabela flutuante
function setNotesGroupOpen(open){
    if(!notesGroup) return;
    notesToolsOpen = !!open;
    if(open) notesGroup.classList.add('is-open');
    else notesGroup.classList.remove('is-open');

    // ao recolher, oculta a tabela flutuante imediatamente
    var panel = document.getElementById('ecomapNotesTablePanel');
    if(panel && !notesToolsOpen){
        panel.style.display = 'none';
    }
}

            setNotesMode(notesMode === 'polygon' ? null : 'polygon');
        });
        notesBtnsByMode['polygon'] = bPoly;

        var bLine = mkBtn('Anotações: desenhar linha', '<i class="fas fa-project-diagram"></i>', function(){
            setNotesMode(notesMode === 'polyline' ? null : 'polyline');
        });
        notesBtnsByMode['polyline'] = bLine;

        var bPt = mkBtn('Anotações: inserir ponto', '<i class="fas fa-map-marker-alt"></i>', function(){
            setNotesMode(notesMode === 'marker' ? null : 'marker');
        });
        notesBtnsByMode['marker'] = bPt;

        var bEdit = mkBtn('Anotações: editar geometria', '<i class="fas fa-edit"></i>', function(){
            setNotesMode(notesMode === 'edit' ? null : 'edit');
        });
        notesBtnsByMode['edit'] = bEdit;
        // NÃO mexer na funcionalidade do botão de download (export)
        mkBtn('Anotações: exportar GeoJSON', '<i class="fas fa-download"></i>', function(){
            stopAllNoteModes();
            exportNotesGeoJSON();
        });

        mkBtn('Anotações: limpar tudo', '<i class="fas fa-trash-alt"></i>', function(){
            stopAllNoteModes();
            clearAllNotes();
        });


        // Botão da Tabela (somente mobile; aparece quando houver feições)
        var bTable = mkBtn('Tabela de anotações (mostrar/ocultar)', '<i class="fas fa-table"></i>', function(){
            toggleNotesTableVisible();
        });
        bTable.classList.add('ecomap-notes-tablebtn');
        window._ecomapNotesTableBtn = bTable;

        // inicia COLAPSADO
        setNotesGroupOpen(false);

        // clique no principal: expandir/recolher
        L.DomEvent.on(aMain, 'click', function(ev){
            L.DomEvent.preventDefault(ev);
            var open = !container.classList.contains('is-open');
            if(!open){
                // ao recolher, para qualquer modo ativo (evita ficar "ligado" invisível)
                try{ stopAllNoteModes(); }catch(e){}
            }
            setNotesGroupOpen(open);
            // ao expandir, reexibe a tabela se houver feições
            if(open){ try{ refreshNotesTable(); }catch(e){} }
        });

        L.DomEvent.disableClickPropagation(container);
        return container;
    }
});

            docLink('<b>Tabela de Uso do Solo - Áreas</b>', 'uso_do_solo_durigon.html')
        ];
        var lay = L.control.layers.tree(null, overlaysTree, {
            collapsed: true,
            closedSymbol: '+',
            openedSymbol: '−'
        }).addTo(map);

        var layersContainer = lay.getContainer();
        var layersToggle = layersContainer.querySelector('.leaflet-control-layers-toggle');
        map.off('click', lay.collapse, lay);
        ['mouseover', 'mouseout', 'mouseenter', 'mouseleave'].forEach(function (eventName) {
            layersContainer.addEventListener(eventName, function (event) {
                event.stopImmediatePropagation();
            }, true);
        });
        layersToggle.title = 'Camadas';
        layersToggle.setAttribute('aria-label', 'Camadas');
        layersToggle.setAttribute('aria-expanded', 'false');
        function toggleLayers(event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            var open = !layersContainer.classList.contains('leaflet-control-layers-expanded');
            if (open) lay.expand();
            else lay.collapse();
            layersToggle.setAttribute('aria-expanded', String(open));
            document.body.classList.toggle('layers-open', open);
        }
        layersToggle.addEventListener('click', toggleLayers, true);
        layersToggle.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') toggleLayers(event);
        }, true);

        var talhaoLabels = L.layerGroup();
        map.createPane('pane_DurigonSelection');
        map.getPane('pane_DurigonSelection').style.zIndex = 422;
        map.getPane('pane_DurigonSelection').style.pointerEvents = 'none';

        var talhaoSelection = L.geoJSON(null, {
            pane: 'pane_DurigonSelection',
            interactive: false,
            style: {color: '#ffdf54', weight: 3, fillColor: '#ffdf54', fillOpacity: 0.25}
        }).addTo(map);
        var selectedTalhao = null;
        var selectedLabel = null;

        function clearTalhaoSelection() {
            talhaoSelection.clearLayers();
            if (selectedLabel) selectedLabel.setAttribute('aria-pressed', 'false');
            selectedTalhao = null;
            selectedLabel = null;
        }

        layer_Talhes_18.eachLayer(function (polygon) {
            var props = polygon.feature.properties;
            var code = props.COD_TALHAO || props.ID_TALHAO;
            if (!code || !polygon.getBounds().isValid()) return;

            var label = document.createElement('button');
            label.type = 'button';
            label.className = 'durigon-label';
            label.setAttribute('aria-pressed', 'false');
            label.append(String(code));
            if (props.area_ha != null && Number.isFinite(Number(props.area_ha))) {
                label.append(document.createElement('br'), formatPtBR(Number(props.area_ha), 3) + ' ha');
            }

            var rings = polygon.getLatLngs();
            var exterior = polygon.feature.geometry.type === 'MultiPolygon' ? rings[0][0] : rings[0];
            var center = L.PolyUtil.polygonCenter && exterior && exterior.length
                ? L.PolyUtil.polygonCenter(exterior, map.options.crs)
                : polygon.getBounds().getCenter();
            var marker = L.marker(center, {
                pane: 'pane_DurigonLabels',
                icon: labelIcon(label),
                keyboard: false,
                bubblingMouseEvents: true
            });
            label.addEventListener('click', function (event) {
                if (measureActive || notesMode) return;
                event.stopPropagation();
                var alreadySelected = selectedTalhao === polygon;
                clearTalhaoSelection();
                if (!alreadySelected) {
                    talhaoSelection.addData(polygon.feature);
                    selectedTalhao = polygon;
                    selectedLabel = label;
                    label.setAttribute('aria-pressed', 'true');
                }
            });
            talhaoLabels.addLayer(marker);
        });

        var LabelControl = L.Control.extend({
            options: {position: 'topleft'},
            onAdd: function () {
                var container = L.DomUtil.create('div', 'leaflet-bar ecomap-labels-controls');
                L.DomEvent.disableClickPropagation(container);
                function addToggle(text, title, layer) {
                    var link = L.DomUtil.create('a', '', container);
                    link.href = '#';
                    link.textContent = text;
                    link.title = title;
                    link.setAttribute('aria-label', title);
                    link.setAttribute('role', 'button');
                    function update() {
                        var visible = map.hasLayer(layer);
                        link.setAttribute('aria-pressed', String(visible));
                        link.classList.toggle('is-active', visible);
                    }
                    L.DomEvent.on(link, 'click', function (event) {
                        L.DomEvent.stop(event);
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                        else map.addLayer(layer);
                    });
                    layer.on('add remove', update);
                    update();
                }
                addToggle('123', 'Mostrar ou ocultar os números das matrículas', layer_Matriculas_dot_24);
                addToggle('T', 'Mostrar ou ocultar os rótulos dos talhões', talhaoLabels);
                return container;
            }
        });
        talhaoLabels.on('remove', clearTalhaoSelection);
        map.addControl(new LabelControl());
        </script>
    </body>
</html>
