  /* tabela mais “enxuta” (sem espaço vazio à direita) */
  #ecomapNotesTablePanel table{
    width:100%;

    table-layout:auto;          /* permite a coluna de medições crescer */
    min-width: 620px;           /* força scroll horizontal no mobile quando necessário */
  }
  #ecomapNotesTablePanel th:nth-child(1), #ecomapNotesTablePanel td:nth-child(1){ width:38%; }

  #ecomapNotesTablePanel th, #ecomapNotesTablePanel td{
    white-space:nowrap;

  /* mantém elipse só nas colunas curtas */
  #ecomapNotesTablePanel th:nth-child(1), #ecomapNotesTablePanel td:nth-child(1),
  #ecomapNotesTablePanel th:nth-child(2), #ecomapNotesTablePanel td:nth-child(2){
    overflow:hidden;

  /* coluna de medições: mostra completo (com rolagem horizontal) */
  #ecomapNotesTablePanel th:nth-child(3), #ecomapNotesTablePanel td:nth-child(3){
    overflow:visible;
    text-overflow:clip;

        var entradaBounds = [[-27.479586411618964,-50.95888827441364],[-27.465413987863034,-50.92857801747282]];

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

/* ====== Home / Recenter control (Casinha) ====== */

        // ===== Trena EcoMap (com casas decimais + área/perímetro) =====
        // Como usar:
        // 1) Clique na régua para ativar

        var hintEl = document.getElementById('ecomapHint');

        function showHint(html){
            if(!hintEl) return;
            hintEl.innerHTML = html;
            hintEl.style.display = 'block';
        }
        function hideHint(){
            if(!hintEl) return;
            hintEl.style.display = 'none';
        }

        function formatPtBR(n, decimals){
            try{
                return n.toLocaleString('pt-BR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
            }catch(e){
                var s = n.toFixed(decimals);
                return s.replace('.', ',');
            }
        }

        function formatArea(m2){
            if(m2 >= 10000){
                return formatPtBR(m2/10000, 4) + ' ha';
            }
            return formatPtBR(m2, 2) + ' m²';
        }

        // Cálculo de área geodésica (sem dependências externas)
        // Fórmula esférica (variação Chamberlain & Duquette), usada em diversas ferramentas Leaflet.
        function geodesicArea(latLngs){
            var points = latLngs;
            if(!points || points.length < 3) return 0;

            var radius = 6378137; // WGS84 (m)
            var area = 0;

            for (var i = 0, len = points.length; i < len; i++) {
                var p1 = points[i];
                var p2 = points[(i + 1) % len];

                var lon1 = p1.lng * Math.PI / 180;
                var lon2 = p2.lng * Math.PI / 180;
                var lat1 = p1.lat * Math.PI / 180;
                var lat2 = p2.lat * Math.PI / 180;

                area += (lon2 - lon1) * (2 + Math.sin(lat1) + Math.sin(lat2));
            }

            area = area * radius * radius / 2.0;
            return Math.abs(area);
        }

        function formatDistance(meters){
            if(meters >= 1000){
                return formatPtBR(meters/1000, 3) + ' km';
            }
            return formatPtBR(meters, 2) + ' m';
        }

function fmtMeters(m){
  if (!isFinite(m)) return '-';
  return (m >= 1000) ? (m/1000).toFixed(2).replace('.',',') + ' km' : m.toFixed(2).replace('.',',') + ' m';
}
function fmtArea(a){
  if (!isFinite(a)) return '-';
  return (a/10000).toFixed(4).replace('.',',') + ' ha';
}
function lineLength(latlngs){
  var sum = 0;
  for (var i=1;i<latlngs.length;i++){ sum += map.distance(latlngs[i-1], latlngs[i]); }
  return sum;
}
function polygonPerimeter(latlngs){
  if (latlngs.length < 2) return 0;
  var sum = lineLength(latlngs);
  sum += map.distance(latlngs[latlngs.length-1], latlngs[0]);
  return sum;
}
function polygonArea(latlngs){
  try {
    if (L.GeometryUtil && typeof L.GeometryUtil.geodesicArea === 'function'){
      return Math.abs(L.GeometryUtil.geodesicArea(latlngs));
    }
  } catch(e) {}
  return NaN;
}

function toDMS(deg, isLat){
  // Converte graus decimais para DMS, sem casas decimais nos segundos
  var hemi = isLat ? (deg < 0 ? 'S' : 'N') : (deg < 0 ? 'W' : 'E');
  var abs = Math.abs(deg);
  var d = Math.floor(abs);
  var minFloat = (abs - d) * 60;
  var m = Math.floor(minFloat);
  var secFloat = (minFloat - m) * 60;
  var s = Math.round(secFloat);

  // normaliza arredondamentos (ex.: 59.9 -> 60)
  if(s === 60){ s = 0; m += 1; }
  if(m === 60){ m = 0; d += 1; }

  return d + '°' + String(m).padStart(2,'0') + "'" + String(s).padStart(2,'0') + '"' + hemi;
}


function refreshNotesTable(){
  var panel = document.getElementById('ecomapNotesTablePanel');
  var wrap = document.getElementById('ecomapNotesTableWrap');
  if (!panel || !wrap) return;

  
  var tableBtn = window._ecomapNotesTableBtn || null;
  if (tableBtn){ tableBtn.style.display = 'none'; }
// se as ferramentas de anotação estiverem recolhidas, a tabela deve ficar oculta
  if (!notesToolsOpen){
    panel.style.display = 'none';
    return;
  }

  var rows = [];
  notesLayer.eachLayer(function(l){
    var type = (l instanceof L.Marker) ? 'Ponto' : (l instanceof L.Polygon && !(l instanceof L.Rectangle) ? 'Polígono' : (l instanceof L.Polyline ? 'Linha' : 'Feição'));
    var name = (l.feature && l.feature.properties && (l.feature.properties.note || l.feature.properties.name)) ? (l.feature.properties.note || l.feature.properties.name) : '(sem nome)';
    var metric = '-';
    if (l instanceof L.Marker){
      var pt = l.getLatLng ? l.getLatLng() : null;
      if(pt){
        metric = 'Lat: ' + toDMS(pt.lat, true) + ' | Lon: ' + toDMS(pt.lng, false);
      }
    }
    if (l instanceof L.Polyline && !(l instanceof L.Polygon)){
      var ll = l.getLatLngs();
      metric = fmtMeters(lineLength(ll));
    } else if (l instanceof L.Polygon){
      var ring = l.getLatLngs();
      ring = Array.isArray(ring) && Array.isArray(ring[0]) ? ring[0] : ring;
      var a = polygonArea(ring);
      var p = polygonPerimeter(ring);
      metric = fmtArea(a) + ' | ' + fmtMeters(p);
    }
    rows.push({name:name, type:type, metric:metric});
  });

  if (rows.length === 0){
    panel.style.display = 'none';
    wrap.innerHTML = '';
    if (tableBtn){ tableBtn.style.display = 'none'; }
    return;
  }

  // há feições: habilita botão da tabela (no mobile)
  if (tableBtn){ tableBtn.style.display = ''; }

  // respeitar o estado recolhida/aberta (desktop + mobile)
  if (!notesTableVisible){
    panel.style.display = 'none';
    return;
  }

  var html = '<table><thead><tr><th>Nome</th><th>Tipo</th><th>Medições</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html += '<tr><td>'+String(r.name).replace(/</g,'&lt;')+'</td><td>'+r.type+'</td><td>'+r.metric+'</td></tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  panel.style.display = 'block';
}

(function(){

  try{ if(drawPolyline && drawPolyline.options) drawPolyline.options.finishOnDoubleClick = false; }catch(e){}
  try{ if(drawPolygon && drawPolygon.options) drawPolygon.options.finishOnDoubleClick = false; }catch(e){}

  function gateFinish(handler){
    if(!handler || handler.__ecomapFinishGated) return;
    handler.__ecomapFinishGated = true;
    var origFinish = handler._finishShape;
    if(typeof origFinish !== 'function') return;

    handler._finishShape = function(){
      if(!this._ecomapAllowFinish){
        return; // bloqueia qualquer finalização por gesto/clique
      }
      return origFinish.apply(this, arguments);
    };
  }

  gateFinish(drawPolyline);
  gateFinish(drawPolygon);

  function bindButtons(){
    var btnFinish = document.getElementById('ecomapBtnFinish');
    var btnCancel = document.getElementById('ecomapBtnCancel');
    if(!btnFinish || !btnCancel) return;

    btnFinish.addEventListener('click', function(){
      var h = _ecomapGetActiveDrawHandler();
      if(!h) return;
      try{
        h._ecomapAllowFinish = true;
        if(typeof h._finishShape === 'function') h._finishShape();
      }catch(e){}
      try{ h._ecomapAllowFinish = false; }catch(e){}
    });

    btnCancel.addEventListener('click', function(){
      var h = _ecomapGetActiveDrawHandler();
      try{ if(h) h.disable(); }catch(e){}
      try{ stopAllNoteModes && stopAllNoteModes(); }catch(e){}
      showFinishBar(false);
    });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindButtons);
  else bindButtons();
})();

        else if(mode === 'polygon') showHint('<b>Anotações</b><br>• Clique para criar o polígono<br>• Duplo-clique para finalizar<br>• Clique na feição para escrever/editar observação');
        else if(mode === 'edit') showHint('<b>Anotações</b><br>• Arraste vértices para editar<br>• Clique em “Salvar” na barra do editor quando terminar');
else hideHint();
    }catch(e){}

    // estado visual
    if(notesBtnsByMode && notesBtnsByMode[mode]){
        notesBtnsByMode[mode].classList.add('is-active');
    }
}

// ===== Exportação GeoJSON =====
function downloadTextFile(filename, textContent){
    var blob = new Blob([textContent], {type: 'application/geo+json;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 800);
}

function exportNotesGeoJSON(){
    try{
        if(!notesLayer || notesLayer.getLayers().length === 0){
            alert('Não há anotações para exportar.');
            return;
        }
        var gj = notesLayer.toGeoJSON();
        // garantia: incluir CRS não é padrão no GeoJSON moderno, então omitimos.
        var txt = JSON.stringify(gj, null, 2);
        var fname = 'anotacoes_santa_lucia_' + (new Date().toISOString().slice(0,10)) + '.geojson';
        downloadTextFile(fname, txt);
    }catch(e){
        alert('Falha ao exportar anotações.');
    }
}

    if(!notesLayer) return;

    notesLayer.clearLayers();
    hideHint();
}

                if (!part[0] || part[0].length < 3) return;
                var projected = part.map(function (ring) {
                    return ring.map(function (point) { return map.project(point, labelProjectionZoom); });
                });
                var bounds = L.bounds(projected[0]);
                var size = bounds.getSize();
                if (!size.x || !size.y) return;

                function makeCell(point, halfSize) {
                    var distance = standEdgeDistance(point, projected);
                    return {point: point, halfSize: halfSize, distance: distance,
                        upperBound: distance + halfSize * Math.SQRT2, rings: projected};
                }

                // Search for the interior point with the most room around it.
                var cells = [makeCell(bounds.getCenter(), Math.max(size.x, size.y) / 2)];
                while (cells.length) {
                    var cell = cells.pop();
                    if (cell.distance > 0 && (!best || cell.distance > best.distance)) best = cell;
                    if (cell.upperBound <= (best ? best.distance : 0) + 0.25) continue;

                    var half = cell.halfSize / 2;
                    var x = cell.point.x, y = cell.point.y;
                    var children = [
                        makeCell(L.point(x - half, y - half), half),
                        makeCell(L.point(x + half, y - half), half),
                        makeCell(L.point(x - half, y + half), half),
                        makeCell(L.point(x + half, y + half), half)
                    ];
                    children.sort(function (a, b) { return a.upperBound - b.upperBound; });
                    cells.push.apply(cells, children);
                }
            });

            return best;
        }

        function standLabelFits(placement, halfWidth, halfHeight) {
            if (Math.hypot(halfWidth, halfHeight) < placement.distance) return true;

            // The label is inside if no boundary segment intersects its rectangle.
            var center = placement.point;
            return placement.rings.every(function (ring) {
                return ring.every(function (a, index) {
                    var b = ring[(index + 1) % ring.length];
                    if (Math.max(a.x, b.x) < center.x - halfWidth ||
                        Math.min(a.x, b.x) > center.x + halfWidth ||
                        Math.max(a.y, b.y) < center.y - halfHeight ||
                        Math.min(a.y, b.y) > center.y + halfHeight) return true;

                    var dx = b.x - a.x, dy = b.y - a.y;
                    return Math.abs(dx * (center.y - a.y) - dy * (center.x - a.x)) >
                        Math.abs(dx) * halfHeight + Math.abs(dy) * halfWidth;
                });
            });
        }

        function updateStandLabelVisibility() {
            if (!map.hasLayer(talhaoLabels)) return;
            var scale = map.getZoomScale(map.getZoom(), labelProjectionZoom);
            standLabels.forEach(function (stand) {
                var halfWidth = (stand.label.offsetWidth / 2 + 2) / scale;
                var halfHeight = (stand.label.offsetHeight / 2 + 2) / scale;
                stand.label.style.visibility = standLabelFits(stand.placement, halfWidth, halfHeight)
                    ? '' : 'hidden';
            });
        }

        layer_Talhes_21.eachLayer(function (polygon) {
            var props = polygon.feature.properties;
            var code = props.COD_TALHAO || props.ID_TALHAO;
            if (!code || !polygon.getBounds().isValid()) return;

            var placement = standLabelPlacement(polygon);
            if (!placement) return;

            var label = document.createElement('button');
            label.type = 'button';
            label.className = 'entrada-label';
            label.setAttribute('aria-pressed', 'false');
            var codeLine = document.createElement('span');
            codeLine.textContent = String(code);
            label.appendChild(codeLine);
            if (props.area_ha != null && Number.isFinite(Number(props.area_ha))) {
                var areaLine = document.createElement('span');
                areaLine.textContent = formatPtBR(Number(props.area_ha), 3) + ' ha';
                label.appendChild(areaLine);
            }

            var center = map.unproject(placement.point, labelProjectionZoom);
            var marker = L.marker(center, {
                pane: 'pane_EntradaLabels',
                icon: labelIcon(label),
                keyboard: false,
                bubblingMouseEvents: true
            });
            label.addEventListener('click', function (event) {
                if (measureActive || notesMode) return;
                event.stopPropagation();
                var alreadySelected = selectedTalhao === polygon;
                clearTalhaoSelection();
                if (!alreadySelected) {
                    talhaoSelection.addData(polygon.feature);
                    selectedTalhao = polygon;
                    selectedLabel = label;
                    label.setAttribute('aria-pressed', 'true');
                }
            });
            talhaoLabels.addLayer(marker);
            standLabels.push({label: label, placement: placement});
        });

        var LabelControl = L.Control.extend({
            options: {position: 'topleft'},
            onAdd: function () {
                var container = L.DomUtil.create('div', 'leaflet-bar ecomap-labels-controls');
                L.DomEvent.disableClickPropagation(container);
                function addToggle(text, title, layer) {
                    var link = L.DomUtil.create('a', '', container);
                    link.href = '#';
                    link.textContent = text;
                    link.title = title;
                    link.setAttribute('aria-label', title);
                    link.setAttribute('role', 'button');
                    function update() {
                        var visible = map.hasLayer(layer);
                        link.setAttribute('aria-pressed', String(visible));
                        link.classList.toggle('is-active', visible);
                    }
                    L.DomEvent.on(link, 'click', function (event) {
                        L.DomEvent.stop(event);
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                        else map.addLayer(layer);
                    });
                    layer.on('add remove', update);
                    update();
                }
                addToggle('123', 'Mostrar ou ocultar os números das matrículas', layer_matricula_dot_31);
                addToggle('T', 'Mostrar ou ocultar os rótulos dos talhões', talhaoLabels);
                return container;
            }
        });
        talhaoLabels.on('add', updateStandLabelVisibility);
        talhaoLabels.on('remove', clearTalhaoSelection);
        map.on('zoomend', updateStandLabelVisibility);
        map.addControl(new LabelControl());
        </script>
    </body>
</html>
